<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5e8d6">
<title>Letters in Aether · 钢琴独奏</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/style.css?v=25">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow" id="eyebrow">Piano Solo · 内置示范曲</p>
      <h1 id="songTitle">Letters in Aether</h1>
      <p class="meta" id="songMeta">原创 · 72 BPM · 4/4</p>
    </div>

    <div class="tools">
      <div class="library-group">
        <span class="library-label">曲库</span>
        <div class="pill library">
          <button id="songBtn" class="song-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="songMenu">
            <span id="songBtnText">内置示范曲</span>
            <i class="caret" aria-hidden="true"></i>
          </button>
          <ul id="songMenu" class="song-menu" role="listbox" aria-label="曲目列表" hidden></ul>
        </div>
      </div>

      <div class="pill vol">
        <button id="volBtn" class="icon vol-btn" type="button" aria-label="音量" aria-expanded="false" aria-controls="volPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="s-body" d="M4 9.3h3.2L11.6 5.6v12.8L7.2 14.7H4z"/>
            <path class="s-wave" d="M14.9 9.3a4.2 4.2 0 0 1 0 5.4"/>
            <path class="s-wave" d="M17.3 6.9a7.4 7.4 0 0 1 0 10.2"/>
          </svg>
        </button>
        <div class="vol-panel" id="volPanel" hidden>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="音量">
        </div>
      </div>
    </div>
  </header>

  <main class="stage" id="stageBox">
    <canvas id="stage"></canvas>
    <p class="hint" id="hint">拖入 <b>.mid</b> 文件可载入任意曲谱 · 曲库 可切换内置曲目 · 空格 播放/暂停 · ← → 快进快退 · 滚轮 缩放 · 拖动画面 平移 · 点击琴键 试弹</p>
  </main>

  <footer class="transport">
    <button id="playBtn" class="play" aria-label="播放">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.3v13.4L19 12z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"/></svg>
    </button>

    <div class="progress" id="progress">
      <div class="track"><div class="fill" id="progressFill"></div></div>
      <div class="knob" id="progressKnob"></div>
    </div>

    <div class="time"><span id="timeNow">0:00</span><i>/</i><span id="timeTotal">0:00</span></div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="splash" id="splash">
  <div class="splash-inner">
    <p class="eyebrow">A Piano Story</p>
    <h1>Letters in Aether</h1>
    <p class="sub">写给光的信 · 原创钢琴小品</p>
    <button id="enterBtn" class="enter">开 始 聆 听</button>
    <p class="tip" id="splashTip">首次进入需加载钢琴采样音色</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>
<script src="js/piece.js?v=25"></script>
<script src="js/audio.js?v=25"></script>
<script src="js/renderer.js?v=25"></script>
<script src="js/app.js?v=25"></script>
</body>
</html>
